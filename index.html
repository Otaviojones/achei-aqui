<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achei Aqui</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e4e7ec;--ac:#0f766e;--ac2:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mut:#98a2b3;--bd:#272d38;--ac:#2dd4bf;--ac2:#0e1116}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mut:#98a2b3;--bd:#272d38;--ac:#2dd4bf;--ac2:#0e1116}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:24px}
header{padding:16px 16px 0}h1{font-size:20px;margin:0}
main{padding:8px 16px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--ac2);font:600 14px system-ui}
.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px system-ui}
.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fv{background:none;border:0;font-size:22px;color:var(--ac)}
.lk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lk a{padding:7px 12px;border:1px solid var(--bd);border-radius:20px;color:var(--ac);text-decoration:none;font:600 13px system-ui}
</style>
</head>
<body>
<header><h1>Achei Aqui</h1><div class="mut" style="font-size:12px">Hotéis, pousadas e comércios perto de você</div></header>
<main>
<div class="card">
<input id="q" placeholder="Cidade ou bairro (ex.: Gramado RS)">
<div class="g"><button class="btn" id="bs">Buscar</button><button class="btn o" id="bl">Perto de mim</button></div>
<select id="rd"><option value="1000">Raio de 1 km</option><option value="3000" selected>Raio de 3 km</option><option value="5000">Raio de 5 km</option><option value="10000">Raio de 10 km</option></select>
</div>
<div class="chips" id="ch"></div>
<div class="mut" id="msg" style="padding:2px 2px 6px">Escolha um lugar e uma categoria.</div>
<div id="rs"></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var CAT={hot:{n:"Hotéis",q:['["tourism"="hotel"]'],h:1},pou:{n:"Pousadas",q:['["tourism"~"guest_house|hostel|motel"]','["tourism"]["name"~"ousada"]'],h:1},
lan:{n:"Lanchonetes",q:['["amenity"="fast_food"]']},res:{n:"Restaurantes",q:['["amenity"="restaurant"]']},pad:{n:"Padarias",q:['["shop"="bakery"]']},
mer:{n:"Mercados",q:['["shop"~"supermarket|convenience"]']},far:{n:"Farmácias",q:['["amenity"="pharmacy"]']},pos:{n:"Postos",q:['["amenity"="fuel"]']}};
var cat="hot",POS=null,LAST=[],FAV=[];
try{FAV=JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){}
function svf(){try{localStorage.setItem("fav",JSON.stringify(FAV))}catch(e){}}
function chips(){var h="";Object.keys(CAT).forEach(function(k){h+='<button class="chip'+(cat==k?" on":"")+'" data-k="'+k+'">'+CAT[k].n+"</button>"});
h+='<button class="chip'+(cat=="fav"?" on":"")+'" data-k="fav">★ Favoritos</button>';$("ch").innerHTML=h}
function j(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
function dist(a,b,c,d){var R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(s))}
function fd(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(1).replace(".",",")+" km"}
function geo(){var G=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Geolocation;
var ok=function(r){return{lat:r.coords.latitude,lon:r.coords.longitude}};
if(G)return G.requestPermissions().catch(function(){}).then(function(){return G.getCurrentPosition({timeout:15000})}).then(ok);
return new Promise(function(a,b){navigator.geolocation.getCurrentPosition(function(r){a(ok(r))},b,{timeout:15000})})}
function place(){var t=$("q").value.trim();if(!t)return;$("msg").textContent="Procurando o local...";
j("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(t)).then(function(r){
if(!r.length){$("msg").textContent="Local não encontrado.";return}
POS={lat:parseFloat(r[0].lat),lon:parseFloat(r[0].lon)};search()}).catch(function(){$("msg").textContent="Falha ao buscar o local. Verifique a internet."})}
function near(){$("msg").textContent="Obtendo sua localização...";geo().then(function(p){POS=p;search()}).catch(function(){$("msg").textContent="Não consegui sua localização. Permita o acesso ou digite a cidade."})}
function ql(c,r){var f=CAT[c].q.map(function(x){return"nwr"+x+"(around:"+r+","+POS.lat+","+POS.lon+");"}).join("");return"[out:json][timeout:25];("+f+");out center 100;"}
function search(){if(cat=="fav"){show(FAV,true);return}if(!POS)return;$("msg").textContent="Buscando...";$("rs").innerHTML="";
var r=$("rd").value,q=encodeURIComponent(ql(cat,r)),c=cat;
j("https://overpass-api.de/api/interpreter?data="+q).catch(function(){return j("https://overpass.kumi.systems/api/interpreter?data="+q)}).then(function(d){
var L=[];d.elements.forEach(function(e){var t=e.tags||{};if(!t.name)return;var la=e.lat||(e.center&&e.center.lat),lo=e.lon||(e.center&&e.center.lon);if(!la)return;
var ad=[t["addr:street"],t["addr:housenumber"],t["addr:suburb"]].filter(Boolean).join(", ");
L.push({id:e.type+e.id,n:t.name,la:la,lo:lo,ad:ad,ph:t.phone||t["contact:phone"]||"",w:t.website||t["contact:website"]||"",oh:t.opening_hours||"",c:c,m:dist(POS.lat,POS.lon,la,lo)})});
L.sort(function(a,b){return a.m-b.m});LAST=L.slice(0,60);show(LAST,false)}).catch(function(){$("msg").textContent="Falha na busca. Tente de novo em instantes."})}
function show(L,f){$("msg").textContent=L.length?L.length+" resultado(s)"+(f?"":" em "+CAT[cat].n.toLowerCase()):(f?"Nenhum favorito ainda.":"Nada encontrado. Aumente o raio ou tente outra categoria.");
$("rs").innerHTML=L.map(function(x,i){var isf=FAV.some(function(y){return y.id==x.id}),cc=CAT[x.c]||{},lk="";
lk+='<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+x.la+","+x.lo+'">Mapa</a>';
if(x.ph)lk+='<a href="tel:'+esc(String(x.ph).split(";")[0].replace(/[^0-9+]/g,""))+'">Ligar</a>';
if(/^https?:\/\//.test(x.w))lk+='<a target="_blank" rel="noopener" href="'+esc(encodeURI(x.w))+'">Site</a>';
if(cc.h)lk+='<a target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(x.n+" reservar preço")+'">Preços e reserva</a>';
return'<div class="card"><div class="top"><div><b>'+esc(x.n)+'</b><div class="mut" style="font-size:13px">'+(x.m!=null&&!f?fd(x.m)+" · ":"")+esc((cc.n||"")+(x.ad?" · "+x.ad:""))+"</div>"+(x.oh?'<div class="mut" style="font-size:12px">Horário: '+esc(x.oh)+"</div>":"")+'</div><button class="fv" data-i="'+i+'" data-f="'+(f?1:0)+'">'+(isf?"★":"☆")+'</button></div><div class="lk">'+lk+"</div></div>"}).join("")}
$("ch").onclick=function(e){var k=e.target.getAttribute("data-k");if(!k)return;cat=k;chips();search()};
$("rs").onclick=function(e){var i=e.target.getAttribute("data-i");if(i===null)return;var L=e.target.getAttribute("data-f")=="1"?FAV:LAST,x=L[+i],p=-1;
FAV.forEach(function(y,n){if(y.id==x.id)p=n});if(p>=0)FAV.splice(p,1);else FAV.push(x);svf();show(L,e.target.getAttribute("data-f")=="1")};
$("bs").onclick=place;$("bl").onclick=near;$("q").onkeydown=function(e){if(e.key=="Enter")place()};$("rd").onchange=search;
chips();
</script>
</body>
</html>
